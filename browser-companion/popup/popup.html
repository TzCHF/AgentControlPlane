<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgentControlPlane Companion 浏览器伴侣</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header><strong>AgentControlPlane</strong><span id="serviceVersion"></span></header>
    <p id="status">…</p>
    <section>
      <label id="languageLabel">语言<select id="language"><option value="zh">中文</option><option value="en">English</option></select></label>
      <label id="workspaceLabel">Workspace<select id="workspace"><option value=""></option></select></label>
      <div class="grid">
        <label id="profileLabel">Profile<select id="profile"><option>balanced</option></select></label>
        <label id="executorLabel">Executor<select id="executor"><option>auto</option></select></label>
      </div>
      <label class="check"><input id="autoSubmitResults" type="checkbox"><span id="autoSubmitLabel"></span></label>
    </section>
    <div class="actions">
      <button id="pair" class="primary">Pair</button>
      <button id="enable">Enable site</button>
      <button id="refresh">Refresh</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
