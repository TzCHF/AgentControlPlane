<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgentControlPlane Companion</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header><strong>AgentControlPlane</strong><span>v0.4</span></header>
    <p id="status">Checking local connection…</p>
    <section>
      <label>Workspace<select id="workspace"><option value="">Pair first</option></select></label>
      <div class="grid">
        <label>Profile<select id="profile"><option>balanced</option></select></label>
        <label>Executor<select id="executor"><option>auto</option></select></label>
      </div>
      <label class="check"><input id="autoDispatch" type="checkbox">Auto-dispatch ACP_TASK</label>
      <label class="check"><input id="autoSubmitResults" type="checkbox">Auto-send ACP_RESULT</label>
    </section>
    <div class="actions">
      <button id="pair" class="primary">Pair local service</button>
      <button id="enable">Enable current AI site</button>
      <button id="refresh">Refresh</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
