<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AgentControlPlane</title>
  <desc id="desc">A local control plane that sends web AI briefs to local coding executors and returns task evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.55" stop-color="#111d36"/>
      <stop offset="1" stop-color="#101629"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f2"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1150" cy="80" r="240" fill="#7c6cff" opacity="0.08"/>
  <circle cx="90" cy="600" r="260" fill="#4bd6e5" opacity="0.06"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="72" y="54" width="335" height="38" rx="19" fill="#152b40" stroke="#2f6572"/>
    <text x="239" y="79" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="2" fill="#a9eaf0">LOCAL-FIRST  ·  MCP  ·  MULTI-EXECUTOR</text>
    <text x="72" y="166" font-size="66" font-weight="750" fill="#f7fbff">AgentControlPlane</text>
    <rect x="72" y="188" width="740" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="244" font-size="27" font-weight="500" fill="#d8e4f0">Turn a web-AI conversation into a verified local coding task.</text>

    <g filter="url(#shadow)">
      <rect x="72" y="310" width="280" height="140" rx="20" fill="#111f34" stroke="#31506e"/>
      <rect x="500" y="310" width="280" height="140" rx="20" fill="#111f34" stroke="#31506e"/>
      <rect x="928" y="310" width="280" height="140" rx="20" fill="#111f34" stroke="#31506e"/>
    </g>
    <text x="212" y="354" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#78dce7">WEB AI</text>
    <text x="212" y="394" text-anchor="middle" font-size="23" font-weight="650" fill="#f7fbff">ChatGPT · DeepSeek</text>
    <text x="212" y="425" text-anchor="middle" font-size="20" fill="#b8c7d9">Claude · MCP clients</text>

    <text x="640" y="354" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#a99eff">CONTROL PLANE</text>
    <text x="640" y="394" text-anchor="middle" font-size="23" font-weight="650" fill="#f7fbff">Brief · State · Routing</text>
    <text x="640" y="425" text-anchor="middle" font-size="20" fill="#b8c7d9">Evidence · Usage</text>

    <text x="1068" y="354" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#78dce7">LOCAL EXECUTOR</text>
    <text x="1068" y="394" text-anchor="middle" font-size="23" font-weight="650" fill="#f7fbff">OpenCode · Codex</text>
    <text x="1068" y="425" text-anchor="middle" font-size="20" fill="#b8c7d9">Claude Code · APIs</text>

    <path d="M365 380 H477" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M466 369 L480 380 L466 391" fill="none" stroke="#8b7cff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M793 380 H905" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M894 369 L908 380 L894 391" fill="none" stroke="#8b7cff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="72" y="505" width="1136" height="78" rx="18" fill="#0b1729" stroke="#263b55"/>
    <text x="640" y="536" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#7f93aa">PERSISTED RESULT</text>
    <text x="640" y="566" text-anchor="middle" font-size="22" font-weight="600" fill="#dce7f3">status  ·  changed files  ·  test evidence  ·  token usage  ·  continuation</text>
  </g>
</svg>
